<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Results | Football Match Center</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="container navbar-container">

            <a href="../index.html" class="logo">
                Football Match Center
            </a>

            <nav class="nav-links">

                <a href="../index.html">Home</a>

                <a href="match-details.html">Matches</a>

                <a href="teams.html">Teams</a>

                <a href="players.html">Players</a>

                <a href="standings.html">Standings</a>

                <a href="fixtures.html">Fixtures</a>

                <a href="results.html" class="active">
                    Results
                </a>

            </nav>

        </div>

    </header>


    <!-- =========================
         PAGE HEADER
    ========================== -->

    <main>

        <section class="page-header">

            <div class="container">

                <span class="section-label">
                    Match Center
                </span>

                <h1>
                    Recent Results
                </h1>

                <p>
                    View completed football matches and final scores.
                </p>

            </div>

        </section>


        <!-- =========================
             RESULTS SECTION
        ========================== -->

        <section class="results-section">

            <div class="container">

                <!-- Filters -->

                <div class="results-filters">

                    <div class="result-filter-group">

                        <label for="competitionFilter">
                            Competition
                        </label>

                        <select id="competitionFilter">

                            <option value="all">
                                All Competitions
                            </option>

                            <option value="Premier League">
                                Premier League
                            </option>

                            <option value="La Liga">
                                La Liga
                            </option>

                            <option value="Bundesliga">
                                Bundesliga
                            </option>

                        </select>

                    </div>


                    <div class="result-filter-group">

                        <label for="dateFilter">
                            Date
                        </label>

                        <select id="dateFilter">

                            <option value="all">
                                All Dates
                            </option>

                            <option value="2026-09-18">
                                18 September
                            </option>

                            <option value="2026-09-17">
                                17 September
                            </option>

                            <option value="2026-09-16">
                                16 September
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Results -->

                <div
                    class="results-list"
                    id="resultsList"
                ></div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 Football Match Center.
                All rights reserved.
            </p>

        </div>

    </footer>


    <script src="../js/main.js"></script>
    <script src="../js/results.js"></script>

</body>

</html>
