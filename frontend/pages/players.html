<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Players - Football Match Center</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>

<body>

    <!-- ================================
         NAVBAR
    ================================= -->

    <header class="navbar">

        <div class="container navbar-content">

            <a href="../index.html" class="logo">
                ⚽ Football Match Center
            </a>

            <nav class="nav-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="matches.html">
                    Matches
                </a>

                <a href="teams.html">
                    Teams
                </a>

                <a href="players.html" class="active">
                    Players
                </a>

                <a href="standings.html">
                    Standings
                </a>

                <a href="fixtures.html">
                    Fixtures
                </a>

                <a href="results.html">
                    Results
                </a>

            </nav>

            <div class="nav-actions">

                <button class="icon-button"
                        id="searchButton">
                    🔍
                </button>

                <button class="mobile-menu-button"
                        id="mobileMenuButton">
                    ☰
                </button>

            </div>

        </div>


        <!-- SEARCH -->

        <div class="search-box"
             id="searchBox">

            <input
                type="text"
                id="searchInput"
                placeholder="Search teams, players..."
            >

        </div>

    </header>


    <!-- ================================
         PAGE HEADER
    ================================= -->

    <section class="page-header">

        <div class="container">

            <h1>
                Football Players
            </h1>

            <p>
                Explore players from different football teams
            </p>

        </div>

    </section>


    <!-- ================================
         PLAYERS SECTION
    ================================= -->

    <section class="players-section">

        <div class="container">

            <div class="section-header">

                <div>

                    <h2>
                        Popular Players
                    </h2>

                    <p>
                        Browse players and their information
                    </p>

                </div>

            </div>


            <!-- FILTER AREA -->

            <div class="players-filters">

                <select id="teamFilter">

                    <option value="all">
                        All Teams
                    </option>

                    <option value="Manchester City">
                        Manchester City
                    </option>

                    <option value="Arsenal">
                        Arsenal
                    </option>

                    <option value="Liverpool">
                        Liverpool
                    </option>

                    <option value="Chelsea">
                        Chelsea
                    </option>

                    <option value="Barcelona">
                        Barcelona
                    </option>

                    <option value="Real Madrid">
                        Real Madrid
                    </option>

                    <option value="Bayern Munich">
                        Bayern Munich
                    </option>

                    <option value="Borussia Dortmund">
                        Borussia Dortmund
                    </option>

                </select>


                <select id="positionFilter">

                    <option value="all">
                        All Positions
                    </option>

                    <option value="Goalkeeper">
                        Goalkeeper
                    </option>

                    <option value="Defender">
                        Defender
                    </option>

                    <option value="Midfielder">
                        Midfielder
                    </option>

                    <option value="Forward">
                        Forward
                    </option>

                </select>

            </div>


            <!-- PLAYERS GRID -->

            <div class="players-grid"
                 id="playersGrid">

                <!-- Players will be rendered by JavaScript -->

            </div>

        </div>

    </section>


    <!-- ================================
         FOOTER
    ================================= -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 Football Match Center.
                All rights reserved.
            </p>

        </div>

    </footer>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script src="../js/main.js"></script>
    <script src="../js/players.js"></script>

</body>

</html>
