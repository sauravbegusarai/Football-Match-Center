<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fixtures | Football Match Center</title>

    <link
        rel="stylesheet"
        href="../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../css/main.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

</head>


<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="container navbar-content">

            <a
                href="../index.html"
                class="logo"
            >
                Football Match Center
            </a>


            <nav class="nav-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="match-details.html">
                    Matches
                </a>

                <a href="teams.html">
                    Teams
                </a>

                <a href="players.html">
                    Players
                </a>

                <a href="standings.html">
                    Standings
                </a>

                <a
                    href="fixtures.html"
                    class="active"
                >
                    Fixtures
                </a>

                <a href="#">
                    Results
                </a>

            </nav>


            <div class="nav-actions">

                <button
                    class="icon-button"
                    id="searchButton"
                >
                    🔍
                </button>

                <button
                    class="mobile-menu-button"
                    id="mobileMenuButton"
                >
                    ☰
                </button>

            </div>

        </div>


        <!-- Search -->

        <div
            class="search-box"
            id="searchBox"
        >

            <input
                type="text"
                id="searchInput"
                placeholder="Search teams, players..."
            >

        </div>

    </header>


    <!-- =========================
         PAGE HEADER
    ========================== -->

    <section class="page-header">

        <div class="container">

            <h1>
                Upcoming Fixtures
            </h1>

            <p>
                Upcoming football matches and scheduled games
            </p>

        </div>

    </section>


    <!-- =========================
         FIXTURES SECTION
    ========================== -->

    <main>

        <section class="fixtures-section">

            <div class="container">


                <!-- Filters -->

                <div class="fixtures-filters">

                    <div class="fixture-filter-group">

                        <label for="competitionFilter">
                            Competition
                        </label>

                        <select id="competitionFilter">

                            <option value="all">
                                All Competitions
                            </option>

                            <option value="Premier League">
                                Premier League
                            </option>

                            <option value="La Liga">
                                La Liga
                            </option>

                            <option value="Bundesliga">
                                Bundesliga
                            </option>

                        </select>

                    </div>


                    <div class="fixture-filter-group">

                        <label for="dateFilter">
                            Date
                        </label>

                        <select id="dateFilter">

                            <option value="all">
                                All Dates
                            </option>

                            <option value="2026-09-20">
                                20 September
                            </option>

                            <option value="2026-09-21">
                                21 September
                            </option>

                            <option value="2026-09-22">
                                22 September
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Fixtures Container -->

                <div
                    class="fixtures-list"
                    id="fixturesList"
                >

                    <!--
                        Fixtures will be rendered
                        using JavaScript
                    -->

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 Football Match Center.
                All rights reserved.
            </p>

        </div>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="../js/main.js"></script>

    <script src="../js/fixtures.js"></script>

</body>

</html>
