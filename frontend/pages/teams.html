<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teams - Football Match Center</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>

<body>

    <!-- =========================================
         NAVBAR
    ========================================== -->

    <header class="navbar">

        <div class="container navbar-content">

            <!-- Logo -->

            <a href="../index.html" class="logo">
                ⚽ Football Match Center
            </a>


            <!-- Navigation -->

            <nav class="nav-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="matches.html">
                    Matches
                </a>

                <a href="teams.html" class="active">
                    Teams
                </a>

                <a href="players.html">
                    Players
                </a>

                <a href="standings.html">
                    Standings
                </a>

                <a href="fixtures.html">
                    Fixtures
                </a>

                <a href="results.html">
                    Results
                </a>

            </nav>


            <!-- Search -->

            <div class="nav-actions">

                <button class="icon-button"
                        id="searchButton">
                    🔍
                </button>

                <button class="mobile-menu-button"
                        id="mobileMenuButton">
                    ☰
                </button>

            </div>

        </div>


        <!-- Search Box -->

        <div class="search-box"
             id="searchBox">

            <input
                type="text"
                id="searchInput"
                placeholder="Search teams, players..."
            >

        </div>

    </header>



    <!-- =========================================
         PAGE HEADER
    ========================================== -->

    <section class="page-header">

        <div class="container">

            <h1>Football Teams</h1>

            <p>
                Explore football teams from different leagues
            </p>

        </div>

    </section>



    <!-- =========================================
         TEAMS SECTION
    ========================================== -->

    <section class="teams-section">

        <div class="container">

            <div class="section-header">

                <div>

                    <h2>Popular Teams</h2>

                    <p>
                        Browse teams and their information
                    </p>

                </div>

            </div>


            <!-- Teams Grid -->

            <div class="teams-grid"
                 id="teamsGrid">

                <!-- Teams will be rendered by JavaScript -->

            </div>

        </div>

    </section>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 Football Match Center.
                All rights reserved.
            </p>

        </div>

    </footer>



    <!-- JavaScript -->

    <script src="../js/main.js"></script>
    <script src="../js/teams.js"></script>

</body>

</html>
